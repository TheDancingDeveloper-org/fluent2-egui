[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/thedancingdeveloper/fluent2-egui"

[workspace.dependencies]
fluent2-tokens = { path = "crates/fluent2-tokens", version = "0.2.0" }
fluent2-icons = { path = "crates/fluent2-icons", version = "0.2.0" }
fluent2-egui = { path = "crates/fluent2-egui", version = "0.2.0" }
# One egui minor per release line; see UPSTREAM.md "egui" and docs/ARCHITECTURE.md "Versioning".
egui = { version = "0.36", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

# Wasm size (docs/wasm-size.md): the gallery wasm build selects this profile through
# `data-cargo-profile` in crates/gallery/index.html. It changes code generation only, not the
# API, and it leaves `[profile.release]` (native builds, published crates) untouched.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
