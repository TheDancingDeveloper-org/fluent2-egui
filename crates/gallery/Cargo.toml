[package]
name = "gallery"
description = "Fluent 2 component gallery for fluent2-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Reads the OS appearance for the "Follow system" toggle. The app turns it on; the library
# keeps it off by default. Without it, "Follow system" falls back to the light theme.
default = ["system-preferences"]
system-preferences = ["fluent2-egui/system-preferences"]
# Pixel snapshots of every page for the README gallery, through a wgpu adapter. Off in
# `cargo test`; see tests/gallery_snapshots.rs and scripts/gallery-screenshots.sh.
snapshots = ["egui_kittest/wgpu", "egui_kittest/snapshot"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
egui = { workspace = true }
fluent2-egui = { workspace = true, features = ["terminal", "file-dialog", "docking", "serde", "markdown", "diff", "highlight", "html", "chrono"] }
fluent2-icons = { workspace = true }
fluent2-tokens = { workspace = true }
log = "0.4"

[dev-dependencies]
egui_kittest = "0.36"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
