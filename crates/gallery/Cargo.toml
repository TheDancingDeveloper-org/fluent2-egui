[package]
name = "gallery"
description = "Fluent 2 component gallery for fluent2-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
egui = { workspace = true }
fluent2-egui = { workspace = true }
fluent2-icons = { workspace = true }
fluent2-tokens = { workspace = true }
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
