[package]
name = "fluent2-egui"
description = "Fluent 2 themes, controls and Office-style application chrome for egui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
egui = { workspace = true }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
log = "0.4"
fluent2-tokens = { workspace = true }
fluent2-icons = { workspace = true }
serde = { version = "1", optional = true, features = ["derive"] }
# LayoutStore keeps each registered state as a JSON value (MIT OR Apache-2.0, builds for wasm).
serde_json = { version = "1", optional = true }
vte = { version = "0.15", optional = true }
unicode-width = { version = "0.2", optional = true }
# Native and browser file dialogs (MIT). `xdg-portal` keeps Linux free of GTK.
# Line and word diffs for DiffView (Apache-2.0).
imara-diff = { version = "0.2", optional = true, default-features = false }
rfd = { version = "0.17", optional = true, default-features = false, features = ["xdg-portal"] }
pulldown-cmark = { version = "0.13.4", default-features = false, optional = true }
html5gum = { version = "0.8.4", default-features = false, optional = true }
chrono = { version = "0.4", default-features = false, optional = true }
# Syntax highlighting for CodeView (MIT). Pure-Rust regex engine so it builds for wasm.
syntect = { version = "5.3", optional = true, default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing", "yaml-load"] }

[features]
default = ["bundled-font"]
# Inter Regular and SemiBold (OFL-1.1, `fonts/`) as the UI font wherever the OS has no Segoe UI:
# every non-Windows target, and Windows without Segoe UI. Adds about 830 KB. Turn it off with
# `default-features = false` to keep egui's default face instead.
bundled-font = []
# Mirror egui's AccessKit output into an invisible DOM layer on wasm so browser accessibility
# tools can discover widget roles, names and focus. No effect on native targets.
web-a11y = []
# Serde for the state structs of the data views (`data::data_grid::DataGridState` and friends),
# and `platform::LayoutStore`, which saves them under keys as one JSON document.
serde = ["dep:serde", "dep:serde_json"]
# TerminalView and its VT grid model (`data::terminal`). Not a Fluent component, so off by
# default; it adds the `vte` parser. See docs/ARCHITECTURE.md "Optional features".
terminal = ["dep:vte", "dep:unicode-width"]
# DiffView and its model (`data::diff`): line and word diffs through `imara-diff`, inline and
# side by side. Off by default. See docs/ARCHITECTURE.md "Optional features".
diff = ["dep:imara-diff", "dep:unicode-width"]
# CodeView and the shared syntax highlighter (`data::code`), on syntect with its bundled
# syntaxes. Not a Fluent component, so off by default; it adds about 1 MB of syntax data.
highlight = ["dep:syntect"]
# Async open and save dialogs through `rfd` (`platform::file_dialog`), polled from the frame.
# Off by default; it pulls in the platform dialog bindings.
file-dialog = ["dep:rfd", "dep:pollster", "dep:wasm-bindgen-futures"]
# Docking (`surfaces::DockTree`, `DockArea`, `SideDock`): a pane split tree with a TabStrip per
# pane, tab drag between panes and collapsible side docks. Not a Fluent component, so off by
# default. No extra dependencies. See docs/specs/data-views.md §9.
docking = []
# MarkdownView (`data::markdown`): CommonMark plus GFM tables, strikethrough and task lists on
# `pulldown-cmark`, painted with the Fluent type ramp. Not a Fluent component, so off by default.
markdown = ["dep:pulldown-cmark"]
# HtmlView (`data::html`): a sanitised HTML subset (block flow, lists, quotes, tables as grids,
# links and images through app policies, a few inline styles) tokenised by `html5gum`. Built for
# HTML mail. Not a Fluent component, so off by default.
html = ["dep:html5gum"]
# Lets `data::find::capture_browser_find` cancel the browser's own find on Ctrl+F (wasm only), so
# the FindBar gets the key. No effect on native targets.
web-find = []
# LineChart (`controls::LineChart`, `ChartSeries`, `TimeRange`): a multi-series time-series chart
# with axes, legend, hover read-out and time-range chips, painted with egui only. Off by default.
chart = []
# `From` conversions between the calendar types (`CalendarDate`, `TimeOfDay`) and `chrono`'s
# `NaiveDate` and `NaiveTime`.
chrono = ["dep:chrono"]
# Pixel snapshots through a wgpu adapter. Off in `cargo test`; see tests/font_snapshots.rs.
# Also turns on egui's default fonts, so the egui-default option has its Ubuntu-Light face.
snapshots = ["egui_kittest/wgpu", "egui_kittest/snapshot", "egui/default_fonts"]
# OS accent, high contrast, reduced motion and colour scheme. Off by default so wasm and
# headless builds do not pull in platform bindings. See `platform`.
system-preferences = [
    "dep:windows",
    "dep:zbus",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Drives the dialog future on its worker thread (native only).
pollster = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }
# FileDropZone reads a dropped file's size before reading it (already in the tree through egui).
# The URL hash (`platform::hash_state`) reads and replaces `location.hash` through History.
# The capturing keydown listener of `web-find` uses wasm-bindgen (already in the tree through eframe).
web-sys = { version = "0.3", features = ["Blob", "CssStyleDeclaration", "Document", "DomRect", "Element", "File", "EventTarget", "History", "HtmlElement", "KeyboardEvent", "Location", "Window"] }
wasm-bindgen = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = ["UI_ViewManagement"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", optional = true, default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
egui_kittest = "0.36"
# Property tests for numeric and parser boundaries. Dev-only; not a published dependency.
proptest = { version = "1", default-features = false, features = ["std"] }
# Text layout needs a font: without egui's default fonts every galley is empty and has no size,
# so selection tests (tests/text_selection.rs) could not drag across glyphs.
egui = { workspace = true, features = ["default_fonts"] }
# Round-trips the serde state in tests (the `serde` feature).
serde_json = "1"
