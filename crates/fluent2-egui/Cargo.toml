[package]
name = "fluent2-egui"
description = "Fluent 2 themes, controls and Office-style application chrome for egui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
egui = { workspace = true }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
log = "0.4"
fluent2-tokens = { workspace = true }
fluent2-icons = { workspace = true }
serde = { version = "1", optional = true, features = ["derive"] }

[features]
default = ["bundled-font"]
# Inter Regular and SemiBold (OFL-1.1, `fonts/`) as the UI font wherever the OS has no Segoe UI:
# every non-Windows target, and Windows without Segoe UI. Adds about 830 KB. Turn it off with
# `default-features = false` to keep egui's default face instead.
bundled-font = []
# Serde for the state structs of the data views (`data::data_grid::DataGridState` and friends).
serde = ["dep:serde"]
# Pixel snapshots through a wgpu adapter. Off in `cargo test`; see tests/font_snapshots.rs.
# Also turns on egui's default fonts, so the egui-default option has its Ubuntu-Light face.
snapshots = ["egui_kittest/wgpu", "egui_kittest/snapshot", "egui/default_fonts"]
# OS accent, high contrast, reduced motion and colour scheme. Off by default so wasm and
# headless builds do not pull in platform bindings. See `platform`.
system-preferences = [
    "dep:windows",
    "dep:zbus",
]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = ["UI_ViewManagement"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", optional = true, default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
egui_kittest = "0.36"
