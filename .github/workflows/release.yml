name: release

# Runs the gates on a version tag. Publishing the three library crates to crates.io happens
# only from a manual run on the tag ref (Actions > release > Run workflow, use workflow from the
# tag) with `publish_crates` ticked; a tag push never publishes. The crates.io token is the repo
# secret CARGO_REGISTRY_TOKEN.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_crates:
        description: Publish fluent2-tokens, fluent2-icons and fluent2-egui to crates.io
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo xtask gen-tokens && git diff --exit-code
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p fluent2-egui --features serde
      - run: cargo check -p fluent2-egui --target wasm32-unknown-unknown
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Tag matches the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="fluent2-egui"))')
          test "v$version" = "$GITHUB_REF_NAME"

  publish:
    needs: gates
    if: github.event_name == 'workflow_dispatch' && inputs.publish_crates && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Dependency order. crates.io indexes each crate before the next one resolves it; cargo
      # publish waits for that by default.
      - run: cargo publish -p fluent2-tokens
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p fluent2-icons
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p fluent2-egui
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
