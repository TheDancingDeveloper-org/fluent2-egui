name: release

# Runs the gates on a version tag. Publishing the three library crates to crates.io happens
# only from a manual run on the tag ref (Actions > release > Run workflow, use workflow from the
# tag) with `publish_crates` ticked; a tag push never publishes. The crates.io token is the repo
# secret CARGO_REGISTRY_TOKEN.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_crates:
        description: Publish fluent2-tokens, fluent2-icons and fluent2-egui to crates.io
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo xtask gen-tokens && git diff --exit-code
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p fluent2-egui --features serde
      - run: cargo check -p fluent2-egui --target wasm32-unknown-unknown
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Tag matches the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="fluent2-egui"))')
          test "v$version" = "$GITHUB_REF_NAME"

  publish:
    needs: gates
    if: github.event_name == 'workflow_dispatch' && inputs.publish_crates && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
      # scripts/publish-crates.sh checks the tag, a clean tree, licences, and
      # skips a crate whose version is already on crates.io.
      - run: scripts/publish-crates.sh --publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
