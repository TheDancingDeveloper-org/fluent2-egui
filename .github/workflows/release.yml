name: release

# Runs the gates on a version tag. Publishing the three library crates to crates.io happens
# only from a manual run on the tag ref (Actions > release > Run workflow, use workflow from the
# tag) with `publish_crates` ticked; a tag push never publishes. The crates.io token is the repo
# secret CARGO_REGISTRY_TOKEN.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/publish-crates.sh
      - scripts/check-crate-licences.sh
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      publish_crates:
        description: Publish fluent2-tokens, fluent2-icons and fluent2-egui to crates.io
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gates:
    # PRs and the nightly run only the publish dry run below.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo xtask gen-tokens && git diff --exit-code
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p fluent2-egui --features serde
      - run: cargo check -p fluent2-egui --target wasm32-unknown-unknown
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="fluent2-egui"))')
          test "v$version" = "$GITHUB_REF_NAME"

  # The release path is tested before a tag is cut: licence check, package
  # inspection and `cargo publish --dry-run` on PRs touching it and nightly.
  publish-dry-run:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@899b013517f9e7774591216672bf75a46bb9a481 # v2
        with:
          tool: cargo-deny
      - run: scripts/publish-crates.sh --dry-run

  publish:
    needs: gates
    if: github.event_name == 'workflow_dispatch' && inputs.publish_crates && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@899b013517f9e7774591216672bf75a46bb9a481 # v2
        with:
          tool: cargo-deny
      # scripts/publish-crates.sh checks the tag, a clean tree, licences, and
      # skips a crate whose version is already on crates.io.
      - run: scripts/publish-crates.sh --publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
