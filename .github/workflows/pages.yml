name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: pages
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: v0.21.14
      - run: trunk build index.html --release --public-url /fluent2-egui/
        working-directory: crates/gallery
      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/gallery/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # TODO(WI-2072): enable GitHub Pages; until then every main push fails here
    # with "Get Pages site failed" / 404. Quarantined so the build stays green
    # and the failure is visible without blocking anything.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
