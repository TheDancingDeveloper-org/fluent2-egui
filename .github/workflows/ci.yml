name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs everything; a PR runs only what its diff touches.
  # See docs/ci.md.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A force-push cancels the superseded run. Queue entries have unique refs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.c.outputs.rust }}
      gallery: ${{ steps.c.outputs.gallery }}
      full: ${{ steps.c.outputs.full }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: c
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != pull_request ]]; then
            echo "full=true rust=true gallery=true" | tr ' ' '\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rust=false gallery=false
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/*|Cargo.toml|Cargo.lock|rustfmt.toml) rust=true gallery=true ;;
              crates/gallery/*|gallery/*) rust=true gallery=true ;;
              crates/*|xtask/*) rust=true ;;
            esac
          done < <(git diff --name-only "$(git merge-base "$BASE" HEAD)" HEAD)
          printf 'full=false\nrust=%s\ngallery=%s\n' "$rust" "$gallery" | tee -a "$GITHUB_OUTPUT"

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo xtask gen-tokens && git diff --exit-code
      - run: cargo fmt --all --check

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The Windows leg runs in the queue and on main only.
        os: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p fluent2-egui --features serde

  wasm:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p fluent2-egui --target wasm32-unknown-unknown

  doc:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95
      - run: cargo check --workspace

  gallery-wasm:
    needs: changes
    if: needs.changes.outputs.gallery == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: v0.21.14
      - run: trunk build index.html --release
        working-directory: crates/gallery

  # The one context to require: passes when every job passed or was skipped
  # by path scope, fails on any failure or cancellation.
  ci:
    if: always()
    needs: [changes, fmt, test, wasm, doc, msrv, gallery-wasm]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            [[ "$r" == success || "$r" == skipped ]] || exit 1
          done
