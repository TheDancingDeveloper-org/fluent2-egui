name: ci

on:
  pull_request:
  # The merge queue runs everything; a PR runs only what its diff touches.
  # See docs/ci.md.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A force-push cancels the superseded run. Queue entries have unique refs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.c.outputs.rust }}
      gallery: ${{ steps.c.outputs.gallery }}
      fixtures: ${{ steps.c.outputs.fixtures }}
      full: ${{ steps.c.outputs.full }}
      rust_full: ${{ steps.c.outputs.rust_full }}
      rust_packages: ${{ steps.c.outputs.rust_packages }}
      readme: ${{ steps.c.outputs.readme }}
      tokens: ${{ steps.c.outputs.tokens }}
      icons: ${{ steps.c.outputs.icons }}
      deny: ${{ steps.c.outputs.deny }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: c
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != pull_request ]]; then
            printf 'full=true\nrust=true\ngallery=true\nfixtures=true\nrust_full=true\nrust_packages=\nreadme=true\ntokens=true\nicons=true\ndeny=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rust=false gallery=false fixtures=false full=false
          readme=false tokens=false icons=false deny=false
          packages=()
          add_package() {
            local pkg
            for pkg in "${packages[@]}"; do
              [[ "$pkg" == "$1" ]] && return 0
            done
            packages+=("$1")
          }
          while IFS= read -r f; do
            case "$f" in
              # Anything that changes how the workspace resolves or builds takes
              # the full workspace and the Windows matrix.
              .github/*|Cargo.toml|Cargo.lock|rustfmt.toml|rust-toolchain.toml|.cargo/*|deny.toml)
                rust=true gallery=true fixtures=true full=true
                readme=true tokens=true icons=true deny=true ;;
              fixtures/*)
                rust=true fixtures=true ;;
              crates/gallery/*|gallery/*|docs/images/gallery/*|scripts/gallery-screenshots.sh)
                rust=true gallery=true
                add_package gallery ;;
              crates/fluent2-egui/*)
                rust=true fixtures=true
                add_package fluent2-egui
                # The gallery enables every optional feature, so running its
                # tests is what exercises the feature-gated components.
                add_package gallery ;;
              crates/fluent2-icons/*|assets/icons/*|xtask/src/icons.rs)
                rust=true icons=true
                add_package fluent2-icons
                # Icons feed the component interaction tests.
                add_package fluent2-egui
                add_package gallery ;;
              crates/fluent2-tokens/*|design-tokens/*|scripts/gen-tokens*|scripts/snapshot-tokens*)
                rust=true tokens=true
                add_package fluent2-tokens
                add_package fluent2-egui
                add_package gallery ;;
              xtask/*)
                rust=true tokens=true
                add_package xtask
                add_package fluent2-tokens
                add_package fluent2-egui
                add_package gallery ;;
              scripts/*)
                # Generators rewrite committed sources; check that they still match.
                rust=true tokens=true
                add_package xtask
                add_package fluent2-tokens ;;
              README.md|README*)
                # The component index is checked by fluent2-egui's readme test.
                rust=true readme=true
                add_package fluent2-egui ;;
              crates/*)
                # A new or unrecognised crate is not safe to narrow.
                rust=true fixtures=true full=true ;;
              *)
                # An unclassified path fails safe: the full PR set, not nothing.
                rust=true gallery=true fixtures=true full=true
                readme=true tokens=true icons=true deny=true ;;
            esac
          done < <(git diff --name-only "$(git merge-base "$BASE" HEAD)" HEAD)
          # A Rust change we could not attribute to a package still needs the
          # full workspace rather than no check at all.
          if [[ "$rust" == true && "$full" == false && "$fixtures" == false && ${#packages[@]} -eq 0 ]]; then
            full=true
          fi
          printf 'full=%s\nrust=%s\ngallery=%s\nfixtures=%s\nrust_full=%s\nrust_packages=%s\nreadme=%s\ntokens=%s\nicons=%s\ndeny=%s\n' \
            "$full" "$rust" "$gallery" "$fixtures" "$full" "${packages[*]}" "$readme" "$tokens" "$icons" "$deny" | tee -a "$GITHUB_OUTPUT"

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, resolves stable
        with:
          components: rustfmt
      - name: Regeneration drift
        if: needs.changes.outputs.tokens == 'true' || needs.changes.outputs.full == 'true'
        run: cargo xtask gen-tokens && git diff --exit-code
      - run: cargo fmt --all --check

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The Windows leg runs in the merge queue only.
        os: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, resolves stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: ci
          save-if: ${{ github.event_name != 'pull_request' }}
      # install-action's tar step fails on the Windows runner's cargo path;
      # Windows falls back to `cargo test` below.
      - uses: taiki-e/install-action@899b013517f9e7774591216672bf75a46bb9a481
        if: runner.os != 'Windows'
        with:
          tool: cargo-nextest
      - name: Resolve the Rust scope
        id: scope
        shell: bash
        env:
          RUST_FULL: ${{ needs.changes.outputs.rust_full }}
          RUST_PACKAGES: ${{ needs.changes.outputs.rust_packages }}
        run: |
          set -euo pipefail
          if [[ "$RUST_FULL" == true ]]; then
            printf 'full=true\nargs=--workspace\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=()
          for pkg in $RUST_PACKAGES; do
            args+=(-p "$pkg")
          done
          printf 'full=false\nargs=%s\n' "${args[*]}" >> "$GITHUB_OUTPUT"
      - name: Clippy
        shell: bash
        env:
          SCOPE_ARGS: ${{ steps.scope.outputs.args }}
        run: |
          read -r -a args <<<"$SCOPE_ARGS"
          cargo clippy "${args[@]}" --all-targets --locked -- -D warnings
      - name: Test
        shell: bash
        env:
          SCOPE_ARGS: ${{ steps.scope.outputs.args }}
          CARGO_PROFILE_TEST_DEBUG: 0
        run: |
          read -r -a args <<<"$SCOPE_ARGS"
          if command -v cargo-nextest >/dev/null; then
            cargo nextest run "${args[@]}" --all-targets --locked
          else
            cargo test "${args[@]}" --all-targets --locked
          fi
      - name: Documentation tests
        shell: bash
        env:
          SCOPE_ARGS: ${{ steps.scope.outputs.args }}
          CARGO_PROFILE_TEST_DEBUG: 0
        run: |
          read -r -a scope <<<"$SCOPE_ARGS"
          # Doc tests need a library target; gallery and xtask are bin-only,
          # so `cargo test --doc -p <bin-only>` errors. Drop them from the scope.
          args=()
          for ((i = 0; i < ${#scope[@]}; i++)); do
            if [[ "${scope[i]}" == -p && ( "${scope[i+1]:-}" == gallery || "${scope[i+1]:-}" == xtask ) ]]; then
              i=$((i + 1)); continue
            fi
            args+=("${scope[i]}")
          done
          if [[ ${#args[@]} -eq 0 ]]; then echo "No library crates in scope; skipping doc tests."; exit 0; fi
          cargo test --doc "${args[@]}" --locked
      - name: Serde feature tests
        if: steps.scope.outputs.full == 'true' || contains(format(' {0} ', needs.changes.outputs.rust_packages), ' fluent2-egui ')
        run: cargo test -p fluent2-egui --features serde
      - name: README index
        if: needs.changes.outputs.readme == 'true' || steps.scope.outputs.full == 'true' || contains(format(' {0} ', needs.changes.outputs.rust_packages), ' fluent2-egui ')
        run: cargo test -p fluent2-egui --test readme_index --locked

  wasm:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, resolves stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: ci
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo check -p fluent2-egui --target wasm32-unknown-unknown

  doc:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, resolves stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: ci
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  # Downstream fixtures: default features off, each optional feature alone, and wasm.
  # Not the gallery (it turns most features on together). Runs when Cargo.toml,
  # feature flags or the fixture itself change — the same class as a full resolve.
  fixtures:
    needs: changes
    if: needs.changes.outputs.fixtures == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - bundled-font
          - web-a11y
          - serde
          - terminal
          - diff
          - highlight
          - file-dialog
          - docking
          - markdown
          - html
          - web-find
          - chart
          - chrono
          - serde,docking
          - markdown,html
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, resolves stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: ci
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Check the consumer
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          args=(-p fluent2-egui-consumer --no-default-features --locked)
          if [[ -n "$FEATURES" ]]; then
            args+=(--features "$FEATURES")
          fi
          cargo check "${args[@]}"

  fixtures-wasm:
    needs: changes
    if: needs.changes.outputs.fixtures == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, resolves stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: ci
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo check -p fluent2-egui-consumer --no-default-features --locked --target wasm32-unknown-unknown

  # The declared rust-version, on the minimal consumer rather than the workspace.
  msrv:
    needs: changes
    if: needs.changes.outputs.fixtures == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, resolves 1.95
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: ci
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo check -p fluent2-egui-consumer --no-default-features --locked

  gallery-wasm:
    needs: changes
    if: needs.changes.outputs.gallery == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, resolves stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: ci
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: jetli/trunk-action@69821d4eec12c308c4b811e459e37556cf920057 # v0.5.0
        with:
          version: v0.21.14
      - run: trunk build index.html --release
        working-directory: crates/gallery

  # The README gallery images (WI-1910): re-render every page in the pinned image the
  # script uses, and fail when a committed PNG differs. The rendered set is uploaded so a
  # stale image can be replaced without Docker. See scripts/gallery-screenshots.sh.
  gallery-screenshots:
    needs: changes
    if: needs.changes.outputs.gallery == 'true'
    runs-on: ubuntu-latest
    container: rust@sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3 # 1.95-trixie
    env:
      GALLERY_SHOTS_IN_CONTAINER: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: gallery-screenshots
          save-if: ${{ github.event_name != 'pull_request' }}
      - id: shots
        run: scripts/gallery-screenshots.sh
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gallery-screenshots
          path: docs/images/gallery/
      - if: failure() && steps.shots.outcome == 'failure'
        run: |
          echo "::error::gallery snapshots changed: run scripts/gallery-screenshots.sh --update and commit the images"


  # Offline: rebuild generated.rs from the committed SVGs and fail on drift.
  # gen-icons itself fetches the pinned upstream revision; this job must not.
  icon-drift:
    needs: changes
    if: needs.changes.outputs.icons == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, resolves stable
      - run: cargo xtask check-icons

  # Advisories and licences. deny.toml is the policy release.yml also uses.
  cargo-deny:
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: ""
          command-arguments: advisories bans licenses sources
  # The one context to require: passes when every job passed or was skipped
  # by path scope, fails on any failure or cancellation.
  ci:
    if: always()
    needs: [changes, fmt, test, wasm, doc, fixtures, fixtures-wasm, msrv, gallery-wasm, gallery-screenshots, icon-drift, cargo-deny]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            [[ "$r" == success || "$r" == skipped ]] || exit 1
          done
