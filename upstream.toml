# Upstream sources this repository depends on, generates from, adapts code from, or follows as a
# behaviour reference. Policy and procedures: UPSTREAM.md. Checker: scripts/upstream-check.py.
#
# Fields
#   repo      GitHub "owner/name".
#   branch    branch the pin is compared against.
#   rev       pinned commit (full SHA). Change it only in a commit that also handles what moved
#             (regenerate, re-review, or note "reviewed, nothing to do") — see UPSTREAM.md.
#   reviewed  date (YYYY-MM-DD) the pin was last reviewed against upstream.
#   licence   SPDX expression of what we use from it.
#   role      dependency | generated | adapted | reference
#               dependency: a Cargo dependency; Cargo.lock is the real pin, `rev` records the
#                           upstream commit of the release we target.
#               generated:  our files are generated from upstream data at `rev`.
#               adapted:    our files contain code adapted from upstream at `rev` (attribution
#                           required; see [[adaptation]] below).
#               reference:  behaviour/design reference only; no code or assets copied.
#   watch     upstream paths whose changes matter to us; the checker reports only these.
#   notes     free text.
#
# [[adaptation]] entries list every file of ours that contains adapted upstream code, so a
# change to the upstream file can be traced to the file here that may need the same fix.

